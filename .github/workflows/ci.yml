# CI: manual-only. Run it from the Actions tab or `gh workflow run ci` when a
# cross-platform check is wanted — both suites on the three platforms
# TokenLedger has to work on, so the scan, adapter, and fixture tests cover
# real path and filesystem behaviour on Windows and Linux with no new test
# code. It used to fire on every push and PR (twice, on PR branches); the
# owner turned that off 2026-08-12 — local suites are the everyday gate.

name: ci

on: [workflow_dispatch]

# a newer push to the same ref makes the in-flight run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # one platform failing should not hide the other two
      fail-fast: false
      matrix:
        # Ubuntu is pinned, not -latest: 22.04 is the oldest release Tauri v2
        # supports, so it is the glibc/webkitgtk floor a built binary inherits.
        # Building on a newer one would silently raise what users need.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The webview and tray the `tauri` crate links against. Tauri v2 needs
      # webkit2gtk **4.1** (v1 wanted 4.0) and the *ayatana* appindicator, which
      # conflicts with the older libappindicator3-dev — do not install both.
      # build-essential/curl/wget/file are already on the runner image.
      # Must precede every cargo step: these are build-time link dependencies.
      # https://v2.tauri.app/start/prerequisites/
      # ponytail: no patchelf — that is AppImage bundling only and CI never
      # bundles. release.yml, which does, installs it there.
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - run: npm ci

      # tsc + vite build — this is the typecheck. It must precede cargo:
      # `tauri::generate_context!` embeds ../dist at compile time, and dist/ is
      # gitignored, so the Rust suite does not compile until it exists.
      - run: npm run build

      - run: npm test

      # Like dist/ above: the export companion is a declared externalBin, and
      # tauri-build refuses to compile the crate while one is missing. The
      # binary is gitignored (it is a build artifact), so a fresh checkout has
      # to produce it before any cargo command, not just before bundling.
      # Release builds get this free — tauri-action runs `tauri build`, which
      # runs beforeBuildCommand — but this workflow calls cargo directly.
      - run: npm run sidecar

      - run: cargo test --manifest-path src-tauri/Cargo.toml
