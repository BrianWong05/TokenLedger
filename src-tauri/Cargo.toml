[package]
name = "tokenledger"
version = "0.1.0"
description = "TokenLedger — AI usage tracker"
authors = ["Brian Wong"]
license = "MIT"
edition = "2021"
default-run = "tokenledger"

[lib]
name = "tokenledger_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Already in the tree via tauri-plugin-updater; the companion needs plaintext
# HTTP/2 for gRPC, which `ureq` cannot do and Windows' bundled curl may not.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2"] }
# reqwest's rustls stack insists on a crypto provider even for a plaintext
# loopback call; `ring` is already in the tree, so install that one.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Already in the tree transitively; declared so the Antigravity Companion can
# unwrap its credential envelope without hand-rolling a decoder on that path.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
zstd = "0.13"
dirs = "5"
ureq = "2"
ts-rs = "10"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

# Dev builds otherwise compile the bundled SQLite at opt-level 0, multiplying
# every Overview query's cost under `tauri dev`.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
